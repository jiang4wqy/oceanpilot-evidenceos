name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Byte-compile
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest -p no:cacheprovider -q

      - name: Offline synthetic demo smoke
        env:
          OCEANPILOT_CHARGEBACK_LIVE_MODEL: "0"
        run: |
          python examples/chargeback_demo.py
          python examples/chargeback_transcript.py
          python scripts/eval_chargeback.py

      - name: Build demo image
        run: docker build --tag oceanpilot-evidenceos:ci .

      - name: Smoke container health and demo page
        run: |
          oceanpilot_container="oceanpilot-evidenceos-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          oceanpilot_health_file="${RUNNER_TEMP}/oceanpilot-health.json"
          oceanpilot_demo_file="${RUNNER_TEMP}/oceanpilot-demo.html"

          oceanpilot_cleanup() {
            docker rm --force "${oceanpilot_container}" >/dev/null 2>&1 || true
          }
          trap oceanpilot_cleanup EXIT

          docker run \
            --detach \
            --name "${oceanpilot_container}" \
            --publish 127.0.0.1:8000:8000 \
            oceanpilot-evidenceos:ci

          oceanpilot_ready=0
          for oceanpilot_attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/health \
              --output "${oceanpilot_health_file}"; then
              oceanpilot_ready=1
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "${oceanpilot_container}")" != "true" ]; then
              docker logs "${oceanpilot_container}"
              exit 1
            fi
            sleep 1
          done

          if [ "${oceanpilot_ready}" -ne 1 ]; then
            docker logs "${oceanpilot_container}"
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/demo \
            --output "${oceanpilot_demo_file}"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          health = json.loads((runner_temp / "oceanpilot-health.json").read_text())
          demo = (runner_temp / "oceanpilot-demo.html").read_text()

          assert health == {"status": "ok"}
          assert "Oceanpayment · 交易诊断" in demo
          assert "Observed facts" in demo
          assert "需要商户补充 2 项信息" in demo
          assert "/api/v1/chargeback" in demo
          assert "人工确认并模拟提交" in demo
          PY
