name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Byte-compile
        run: python -m compileall -q src tests

      - name: Pytest
        run: python -m pytest -p no:cacheprovider -q

      - name: Offline synthetic demo smoke
        env:
          OCEANPILOT_CHARGEBACK_LIVE_MODEL: "0"
        run: |
          python examples/chargeback_demo.py
          python examples/chargeback_transcript.py
          python scripts/eval_chargeback.py
          python scripts/eval_dispute_v2.py

      - name: Build demo image
        run: docker build --tag oceanpilot-evidenceos:ci .

      - name: Smoke container health and demo page
        run: |
          oceanpilot_container="oceanpilot-evidenceos-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          oceanpilot_health_file="${RUNNER_TEMP}/oceanpilot-health.json"
          oceanpilot_demo_file="${RUNNER_TEMP}/oceanpilot-demo.html"

          oceanpilot_cleanup() {
            docker rm --force "${oceanpilot_container}" >/dev/null 2>&1 || true
          }
          trap oceanpilot_cleanup EXIT

          docker run \
            --detach \
            --name "${oceanpilot_container}" \
            --publish 127.0.0.1:8000:8000 \
            oceanpilot-evidenceos:ci

          oceanpilot_ready=0
          for oceanpilot_attempt in {1..30}; do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8000/health \
              --output "${oceanpilot_health_file}"; then
              oceanpilot_ready=1
              break
            fi

            if [ "$(docker inspect --format '{{.State.Running}}' "${oceanpilot_container}")" != "true" ]; then
              docker logs "${oceanpilot_container}"
              exit 1
            fi
            sleep 1
          done

          if [ "${oceanpilot_ready}" -ne 1 ]; then
            docker logs "${oceanpilot_container}"
            exit 1
          fi

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/demo \
            --output "${oceanpilot_demo_file}"

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/business \
            --output "${RUNNER_TEMP}/oceanpilot-business.html"

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/v2/login \
            --output "${RUNNER_TEMP}/oceanpilot-login.html"

          docker exec "${oceanpilot_container}" \
            python -m oceanpilot.v21_accounts \
            --db /app/work/oceanpilot-chargeback.db \
            --output /app/work/ci-accounts.json
          docker cp "${oceanpilot_container}:/app/work/ci-accounts.json" \
            "${RUNNER_TEMP}/oceanpilot-ci-accounts.json"
          chmod 600 "${RUNNER_TEMP}/oceanpilot-ci-accounts.json"

          python - <<'PY'
          import json
          import os
          from http.cookiejar import CookieJar
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import HTTPCookieProcessor, Request, build_opener, urlopen

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          health = json.loads((runner_temp / "oceanpilot-health.json").read_text())
          demo = (runner_temp / "oceanpilot-demo.html").read_text()
          business = (runner_temp / "oceanpilot-business.html").read_text()
          login = (runner_temp / "oceanpilot-login.html").read_text()

          assert health == {"status": "ok"}
          assert "Oceanpayment · 商户工作台" in demo
          assert '"role":"MERCHANT"' in demo
          assert "案件中心" in demo
          assert "新建案件" in demo
          assert 'class="ocean-logo"' in demo
          assert "/api/v1/chargeback" in demo
          assert "CASE-20260814" not in demo
          assert "案件复核摘要（合成示例）" in demo
          assert "最终发送未开放" in demo
          assert "Oceanpayment · 企业争议运营" in business
          assert '"role":"BUSINESS"' in business
          assert "企业争议运营区" in business
          assert "预览本版本复核" in business
          assert "登录你的工作空间" in login

          base = "http://127.0.0.1:8000"
          try:
              urlopen(base + "/api/v2/cases")
              raise AssertionError("V2 API must require a real session")
          except HTTPError as error:
              assert error.code == 401
          credentials_file = runner_temp / "oceanpilot-ci-accounts.json"
          records = json.loads(credentials_file.read_text())["accounts"]
          credentials_file.unlink()
          account = next(row for row in records if row["user"]["username"] == "operator-a")
          browser = build_opener(HTTPCookieProcessor(CookieJar()))
          request = Request(base + "/api/v2/session/login", data=json.dumps({
              "username": account["user"]["username"], "password": account["password"],
          }).encode(), headers={"Content-Type": "application/json", "Origin": base})
          with browser.open(request) as response:
              assert json.load(response)["user"]["role"] == "OPERATOR"
          with browser.open(base + "/v2/operations") as response:
              v2 = response.read().decode()
          assert "/api/v2" in v2
          assert "OceanPilot" in v2
          assert "OceanV21Intake" in v2
          assert "__V2_" not in v2
          with browser.open(base + "/api/v2/cases") as response:
              assert json.load(response)["cases"] == []
          try:
              browser.open(base + "/v2/merchant")
              raise AssertionError("Operator session must not become a merchant")
          except HTTPError as error:
              assert error.code == 403
          PY
