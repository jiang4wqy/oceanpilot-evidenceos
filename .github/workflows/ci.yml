name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests examples scripts

      - name: Ruff format check
        run: ruff format --check src tests examples scripts

      - name: Byte-compile
        run: python -m compileall -q src tests examples scripts

      - name: Pytest
        run: python -m pytest -p no:cacheprovider -q

      - name: Dependency consistency
        run: python -m pip check

      - name: Signed Feishu fixture
        run: python -B examples/signed_fixture_demo.py --work-dir "$RUNNER_TEMP/signed-fixture"

      - name: Wheel smoke
        run: |
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir "$RUNNER_TEMP/wheelhouse"
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheelhouse/*.whl
          python -I -c "import oceanpilot; assert oceanpilot.__version__ == '0.2.1'"

      - name: Diff check
        run: git diff --check

  release-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and dev dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Rebuild and check submission PDF
        run: |
          python -B scripts/build_submission_pdf.py
          python -B scripts/check_submission_pdf.py

      - name: Signed Feishu fixture
        run: python -B examples/signed_fixture_demo.py --work-dir "${{ runner.temp }}/signed-fixture"

      - name: Start local API
        shell: powershell
        run: |
          $env:OCEANPILOT_DB_PATH = '${{ runner.temp }}/demo.db'
          $env:OCEANPILOT_CHARGEBACK_DB_PATH = '${{ runner.temp }}/chargeback.db'
          $process = Start-Process -FilePath 'python' -ArgumentList '-B','-m','uvicorn','oceanpilot.main:create_app','--factory','--host','127.0.0.1','--port','8000' -WindowStyle Hidden -PassThru
          $process.Id | Set-Content '${{ runner.temp }}/uvicorn.pid'
          for ($attempt = 0; $attempt -lt 40; $attempt++) {
            try { Invoke-RestMethod 'http://127.0.0.1:8000/health'; exit 0 } catch { Start-Sleep -Milliseconds 250 }
          }
          exit 1

      - name: Four-rule PowerShell demo
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./examples/demo.ps1

      - name: Stop local API
        if: always()
        shell: powershell
        run: |
          if (Test-Path '${{ runner.temp }}/uvicorn.pid') {
            Stop-Process -Id (Get-Content '${{ runner.temp }}/uvicorn.pid') -ErrorAction SilentlyContinue
          }

      - name: Generated artifact and diff checks
        run: |
          git diff --exit-code -- artifacts
          git diff --check
