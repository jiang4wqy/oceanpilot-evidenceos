services:
  oceanpilot:
    image: oceanpilot:local
    build: .
    env_file:
      - .env
    environment:
      OCEANPILOT_DB_PATH: /app/work/oceanpilot.db
      OCEANPILOT_CHARGEBACK_DB_PATH: /app/work/oceanpilot-chargeback.db
      OCEANPILOT_RULES_DB_PATH: /app/work/oceanpilot-rules.db
      OCEANPILOT_FEISHU_DB_PATH: /app/work/oceanpilot-feishu.db
    ports:
      - "8000:8000"
    volumes:
      - oceanpilot-data:/app/work
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  oceanpilot-data:
