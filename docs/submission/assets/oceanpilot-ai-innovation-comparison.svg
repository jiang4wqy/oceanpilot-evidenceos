<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">从聊天里猜答案到围绕证据形成可审计决策</title>
  <desc id="desc">传统异常处理与 OceanPilot 证据驱动闭环的对比图，突出案件证据契约、证据不足停止判断，以及 AI、规则和人工的职责边界。</desc>
  <defs>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2F8FF"/>
      <stop offset="1" stop-color="#ECFBF7"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#073C78"/>
      <stop offset="1" stop-color="#087F76"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#082F5B" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1662C5"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#98A2B3"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .navy { fill: #082B63; }
      .muted { fill: #667085; }
      .label { font-size: 19px; font-weight: 700; }
      .small { font-size: 16px; }
      .step { font-size: 17px; font-weight: 700; fill: #14345E; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="10" fill="#0B5FC6"/>
  <text x="64" y="58" fill="#087F76" font-size="16" font-weight="700" letter-spacing="2">AI 应用创新 · 证据驱动决策</text>
  <text x="800" y="112" text-anchor="middle" class="navy" font-size="40" font-weight="800">从“聊天里猜答案”到“围绕证据形成可审计决策”</text>
  <text x="800" y="148" text-anchor="middle" class="muted" font-size="18">结构性差异不在于多一个聊天框，而在于每个判断是否受证据、规则与责任约束</text>

  <!-- Traditional side -->
  <rect x="48" y="182" width="472" height="626" rx="24" fill="#F7F8FA" stroke="#D0D5DD" stroke-width="2"/>
  <rect x="48" y="182" width="472" height="74" rx="24" fill="#EEF0F3"/>
  <rect x="48" y="232" width="472" height="24" fill="#EEF0F3"/>
  <circle cx="84" cy="220" r="15" fill="#E4E7EC"/>
  <path d="M78 220h12M84 214v12" stroke="#667085" stroke-width="2.5" stroke-linecap="round"/>
  <text x="112" y="228" fill="#344054" font-size="25" font-weight="800">传统异常处理</text>
  <text x="480" y="228" text-anchor="end" fill="#98A2B3" font-size="15" font-weight="700">信息散落 · 口径不一</text>

  <!-- scattered information cards -->
  <g filter="url(#shadow)">
    <g transform="translate(76 286) rotate(-2 90 42)">
      <rect width="180" height="84" rx="14" fill="#FFFFFF" stroke="#D0D5DD"/>
      <rect x="16" y="17" width="34" height="28" rx="5" fill="#F2F4F7"/>
      <circle cx="33" cy="31" r="7" fill="#98A2B3"/>
      <path d="M19 43l9-8 7 6 8-10 7 14" fill="none" stroke="#667085" stroke-width="2"/>
      <text x="62" y="34" fill="#344054" class="label">聊天截图</text>
      <text x="16" y="65" class="muted small">存在群聊与私聊中</text>
    </g>
    <g transform="translate(286 276) rotate(2 96 42)">
      <rect width="194" height="84" rx="14" fill="#FFFFFF" stroke="#D0D5DD"/>
      <rect x="16" y="16" width="30" height="34" rx="4" fill="#F2F4F7" stroke="#98A2B3"/>
      <path d="M22 26h18M22 34h18M22 42h12" stroke="#667085" stroke-width="2"/>
      <text x="60" y="34" fill="#344054" class="label">订单 / 日志</text>
      <text x="16" y="65" class="muted small">跨系统反复查找</text>
    </g>
    <g transform="translate(92 395) rotate(1 94 42)">
      <rect width="188" height="84" rx="14" fill="#FFFFFF" stroke="#D0D5DD"/>
      <circle cx="34" cy="31" r="16" fill="#F2F4F7"/>
      <text x="34" y="38" text-anchor="middle" fill="#667085" font-size="19" font-weight="800">?</text>
      <text x="62" y="34" fill="#344054" class="label">错误码</text>
      <text x="16" y="65" class="muted small">解释依赖个人经验</text>
    </g>
    <g transform="translate(300 394) rotate(-1 88 42)">
      <rect width="176" height="84" rx="14" fill="#FFFFFF" stroke="#D0D5DD"/>
      <path d="M18 19h30v28H18zM23 25h20M23 32h16M23 39h11" fill="none" stroke="#667085" stroke-width="2"/>
      <text x="60" y="34" fill="#344054" class="label">规则文档</text>
      <text x="16" y="65" class="muted small">版本与来源难追溯</text>
    </g>
  </g>

  <!-- messy handoffs -->
  <path d="M145 505 C160 550 300 505 324 553 S440 576 447 526" fill="none" stroke="#98A2B3" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowGray)"/>
  <path d="M423 502 C406 549 292 535 270 587 S132 593 111 544" fill="none" stroke="#98A2B3" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowGray)"/>
  <g font-size="16" font-weight="700" fill="#475467">
    <g transform="translate(77 588)"><circle cx="25" cy="25" r="25" fill="#E4E7EC"/><text x="25" y="31" text-anchor="middle">商户</text></g>
    <g transform="translate(174 568)"><circle cx="25" cy="25" r="25" fill="#E4E7EC"/><text x="25" y="31" text-anchor="middle">客服</text></g>
    <g transform="translate(271 588)"><circle cx="25" cy="25" r="25" fill="#E4E7EC"/><text x="25" y="31" text-anchor="middle">技术</text></g>
    <g transform="translate(368 568)"><circle cx="25" cy="25" r="25" fill="#E4E7EC"/><text x="25" y="31" text-anchor="middle">风控</text></g>
  </g>
  <text x="284" y="672" text-anchor="middle" fill="#475467" font-size="17" font-weight="700">反复询问 · 过早判断 · 多次改派</text>
  <rect x="76" y="707" width="416" height="72" rx="14" fill="#FDECEC" stroke="#F5C2C7"/>
  <circle cx="103" cy="743" r="13" fill="#D92D20"/>
  <text x="103" y="749" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="800">!</text>
  <text x="128" y="738" fill="#912018" font-size="18" font-weight="800">信息很多，但没有统一证据口径</text>
  <text x="128" y="760" fill="#B42318" font-size="14">缺证时也可能给出结论，过程难以复核</text>

  <!-- Structural bridge -->
  <path d="M538 470H650" stroke="#1662C5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <g filter="url(#shadow)">
    <path d="M590 370 L658 470 L590 570 L522 470 Z" fill="#FFFFFF" stroke="#1662C5" stroke-width="3"/>
    <circle cx="590" cy="421" r="23" fill="#E8F2FF"/>
    <path d="M580 420h20M580 428h14M578 410h18l8 8v19h-26z" fill="none" stroke="#1662C5" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="590" y="460" text-anchor="middle" fill="#0B5FC6" font-size="17" font-weight="800">案件证据</text>
    <text x="590" y="484" text-anchor="middle" fill="#0B5FC6" font-size="17" font-weight="800">契约</text>
    <text x="590" y="514" text-anchor="middle" fill="#667085" font-size="13">类型 · 来源</text>
    <text x="590" y="533" text-anchor="middle" fill="#667085" font-size="13">时间 · 版本</text>
  </g>
  <text x="590" y="602" text-anchor="middle" fill="#0B5FC6" font-size="14" font-weight="700">结构性分界</text>

  <!-- OceanPilot side -->
  <rect x="662" y="182" width="890" height="626" rx="24" fill="url(#rightPanel)" stroke="#9BC4E9" stroke-width="2"/>
  <rect x="662" y="182" width="890" height="74" rx="24" fill="#E5F2FF"/>
  <rect x="662" y="232" width="890" height="24" fill="#E5F2FF"/>
  <circle cx="699" cy="220" r="15" fill="#0B5FC6"/>
  <path d="M692 220l5 5 10-12" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="727" y="228" fill="#082B63" font-size="25" font-weight="800">OceanPilot 证据驱动闭环</text>
  <text x="1514" y="228" text-anchor="end" fill="#087F76" font-size="15" font-weight="700">同一案件 · 持续演进</text>

  <!-- closed-loop ring -->
  <path d="M841 335 C919 276 1235 275 1352 343 C1440 395 1454 559 1352 626 C1249 693 910 691 807 618 C719 556 731 408 807 350" fill="none" stroke="#B9D8F6" stroke-width="18" opacity="0.52"/>
  <path d="M829 341 C914 284 1236 283 1343 350" fill="none" stroke="#1662C5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1391 377 C1443 451 1420 569 1351 617" fill="none" stroke="#1662C5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M1312 646 C1188 689 908 674 809 612" fill="none" stroke="#1662C5" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <path d="M773 584 C726 504 748 402 806 351" fill="none" stroke="#1662C5" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <!-- core -->
  <g filter="url(#shadow)">
    <rect x="958" y="381" width="300" height="170" rx="26" fill="url(#core)"/>
    <path d="M1090 408h37l14 14v45h-51zM1127 408v15h14" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <path d="M1102 441l8 8 17-20" fill="none" stroke="#5EEAD4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1108" y="493" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="800">版本化案件</text>
    <text x="1108" y="524" text-anchor="middle" fill="#BDF5E8" font-size="18" font-weight="700">+ 案件证据契约</text>
  </g>

  <!-- eight loop steps -->
  <g>
    <g transform="translate(745 303)"><rect width="174" height="58" rx="16" fill="#FFFFFF" stroke="#78B5EA"/><circle cx="28" cy="29" r="17" fill="#E8F2FF"/><text x="28" y="35" text-anchor="middle" fill="#0B5FC6" font-size="17" font-weight="800">1</text><text x="55" y="36" class="step">问题建案</text></g>
    <g transform="translate(1041 282)"><rect width="190" height="58" rx="16" fill="#FFFFFF" stroke="#78B5EA"/><circle cx="28" cy="29" r="17" fill="#E8F2FF"/><text x="28" y="35" text-anchor="middle" fill="#0B5FC6" font-size="17" font-weight="800">2</text><text x="55" y="36" class="step">识别证据缺口</text></g>
    <g transform="translate(1300 318)"><rect width="188" height="58" rx="16" fill="#FFFFFF" stroke="#78B5EA"/><circle cx="28" cy="29" r="17" fill="#E8F2FF"/><text x="28" y="35" text-anchor="middle" fill="#0B5FC6" font-size="17" font-weight="800">3</text><text x="55" y="36" class="step">角色化补问</text></g>
    <g transform="translate(1327 442)"><rect width="174" height="58" rx="16" fill="#FFFFFF" stroke="#31A897"/><circle cx="28" cy="29" r="17" fill="#E8F8F4"/><text x="28" y="35" text-anchor="middle" fill="#087F76" font-size="17" font-weight="800">4</text><text x="55" y="36" class="step">证据门槛</text></g>
    <g transform="translate(1295 570)"><rect width="198" height="58" rx="16" fill="#FFFFFF" stroke="#31A897"/><circle cx="28" cy="29" r="17" fill="#E8F8F4"/><text x="28" y="35" text-anchor="middle" fill="#087F76" font-size="17" font-weight="800">5</text><text x="55" y="36" class="step">确定性评估</text></g>
    <g transform="translate(1013 627)"><rect width="208" height="58" rx="16" fill="#FFFFFF" stroke="#31A897"/><circle cx="28" cy="29" r="17" fill="#E8F8F4"/><text x="28" y="35" text-anchor="middle" fill="#087F76" font-size="17" font-weight="800">6</text><text x="55" y="36" class="step">精确规则引用</text></g>
    <g transform="translate(763 570)"><rect width="184" height="58" rx="16" fill="#FFFFFF" stroke="#E99A00"/><circle cx="28" cy="29" r="17" fill="#FFF4DB"/><text x="28" y="35" text-anchor="middle" fill="#B54708" font-size="17" font-weight="800">7</text><text x="55" y="36" class="step">人工确认</text></g>
    <g transform="translate(713 442)"><rect width="174" height="58" rx="16" fill="#FFFFFF" stroke="#78B5EA"/><circle cx="28" cy="29" r="17" fill="#E8F2FF"/><text x="28" y="35" text-anchor="middle" fill="#0B5FC6" font-size="17" font-weight="800">8</text><text x="55" y="36" class="step">审计沉淀</text></g>
  </g>

  <!-- safety branch and role boundary -->
  <path d="M1327 476H1279V536" fill="none" stroke="#E99A00" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arrowGray)"/>
  <rect x="1268" y="512" width="236" height="45" rx="12" fill="#FFF4DB" stroke="#F5B544"/>
  <text x="1386" y="540" text-anchor="middle" fill="#93370D" font-size="16" font-weight="800">证据不足 → 停止判断，继续补证</text>

  <g transform="translate(705 714)">
    <rect width="252" height="56" rx="14" fill="#E8F2FF"/>
    <text x="18" y="25" fill="#0B5FC6" font-size="16" font-weight="800">AI</text>
    <text x="18" y="44" fill="#344054" font-size="14">理解 · 补问 · 摘要 · 起草</text>
  </g>
  <g transform="translate(975 714)">
    <rect width="266" height="56" rx="14" fill="#E8F8F4"/>
    <text x="18" y="25" fill="#087F76" font-size="16" font-weight="800">规则</text>
    <text x="18" y="44" fill="#344054" font-size="14">门槛 · 状态 · 路由 · 引用</text>
  </g>
  <g transform="translate(1259 714)">
    <rect width="252" height="56" rx="14" fill="#FFF4DB"/>
    <text x="18" y="25" fill="#B54708" font-size="16" font-weight="800">人工</text>
    <text x="18" y="44" fill="#344054" font-size="14">高风险裁定</text>
  </g>

  <!-- bottom thesis -->
  <rect x="48" y="832" width="1504" height="46" rx="14" fill="#082B63"/>
  <text x="800" y="862" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="800">OceanPilot：AI 提议，规则约束，人工裁定；每个判断绑定证据、规则版本和责任人</text>
</svg>
