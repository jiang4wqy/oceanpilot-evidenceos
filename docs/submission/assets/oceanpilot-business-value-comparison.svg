<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">同一个拒付案件，协作摩擦如何被收敛</title>
  <desc id="desc">对比传统人工协作与 OceanPilot 加飞书协作台，并以六项明确标注的试点目标展示可验证的业务价值。</desc>
  <defs>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1F7FF"/>
      <stop offset="1" stop-color="#ECFBF7"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B5FC6"/>
      <stop offset="1" stop-color="#087F76"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#082F5B" flood-opacity="0.11"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#1662C5"/></marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 Z" fill="#98A2B3"/></marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .navy { fill: #082B63; }
      .muted { fill: #667085; }
      .role { font-size: 16px; font-weight: 800; fill: #344054; }
      .micro { font-size: 13px; fill: #667085; }
      .flow { font-size: 15px; font-weight: 700; fill: #14345E; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1600" height="10" fill="#087F76"/>
  <text x="64" y="54" fill="#0B5FC6" font-size="16" font-weight="700" letter-spacing="2">业务价值 · 可测量的协作收敛</text>
  <text x="800" y="101" text-anchor="middle" class="navy" font-size="40" font-weight="800">同一个拒付案件，协作摩擦如何被收敛</text>
  <text x="800" y="137" text-anchor="middle" class="muted" font-size="18">流程差异可见，业务价值通过企业试点指标验证</text>

  <!-- upper left -->
  <rect x="48" y="166" width="615" height="420" rx="24" fill="#F7F8FA" stroke="#D0D5DD" stroke-width="2"/>
  <rect x="48" y="166" width="615" height="68" rx="24" fill="#EEF0F3"/>
  <rect x="48" y="214" width="615" height="20" fill="#EEF0F3"/>
  <text x="80" y="209" fill="#344054" font-size="24" font-weight="800">传统人工协作</text>
  <text x="628" y="207" text-anchor="end" fill="#98A2B3" font-size="14" font-weight="700">角色之间多次往返</text>

  <!-- roles -->
  <g>
    <g transform="translate(72 273)"><circle cx="45" cy="45" r="42" fill="#FFFFFF" stroke="#C7CDD6" stroke-width="2"/><circle cx="45" cy="35" r="10" fill="#98A2B3"/><path d="M26 61c4-14 34-14 38 0" fill="#D0D5DD"/><text x="45" y="105" text-anchor="middle" class="role">商户</text></g>
    <g transform="translate(185 273)"><circle cx="45" cy="45" r="42" fill="#FFFFFF" stroke="#C7CDD6" stroke-width="2"/><circle cx="45" cy="35" r="10" fill="#98A2B3"/><path d="M26 61c4-14 34-14 38 0" fill="#D0D5DD"/><text x="45" y="105" text-anchor="middle" class="role">客服</text></g>
    <g transform="translate(298 273)"><circle cx="45" cy="45" r="42" fill="#FFFFFF" stroke="#C7CDD6" stroke-width="2"/><circle cx="45" cy="35" r="10" fill="#98A2B3"/><path d="M26 61c4-14 34-14 38 0" fill="#D0D5DD"/><text x="45" y="105" text-anchor="middle" class="role">技术</text></g>
    <g transform="translate(411 273)"><circle cx="45" cy="45" r="42" fill="#FFFFFF" stroke="#C7CDD6" stroke-width="2"/><circle cx="45" cy="35" r="10" fill="#98A2B3"/><path d="M26 61c4-14 34-14 38 0" fill="#D0D5DD"/><text x="45" y="105" text-anchor="middle" class="role">风控</text></g>
    <g transform="translate(524 273)"><circle cx="45" cy="45" r="42" fill="#FFFFFF" stroke="#C7CDD6" stroke-width="2"/><circle cx="45" cy="35" r="10" fill="#98A2B3"/><path d="M26 61c4-14 34-14 38 0" fill="#D0D5DD"/><text x="45" y="105" text-anchor="middle" class="role">争议运营</text></g>
  </g>
