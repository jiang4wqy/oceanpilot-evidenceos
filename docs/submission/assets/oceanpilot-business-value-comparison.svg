  <path d="M1295 340h18M1313 425h-18" stroke="#087F76" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowBlue)"/>
  <text x="1157" y="526" text-anchor="middle" fill="#087F76" font-size="15" font-weight="800">专业判断留在 OceanPilot 内核 · 协作、AI 摘要与提醒进入飞书</text>
  <rect x="790" y="545" width="734" height="25" rx="8" fill="#E8F8F4"/>
  <text x="1157" y="563" text-anchor="middle" fill="#087F76" font-size="14" font-weight="700">减少往返 · 明确责任 · 证据可引用 · 结果可审计</text>

  <!-- metrics -->
  <rect x="48" y="608" width="1504" height="242" rx="24" fill="#F8FAFC" stroke="#D0D5DD"/>
  <rect x="48" y="608" width="1504" height="50" rx="24" fill="#082B63"/>
  <rect x="48" y="638" width="1504" height="20" fill="#082B63"/>
  <text x="80" y="640" fill="#FFFFFF" font-size="21" font-weight="800">企业试点指标</text>
  <rect x="1137" y="619" width="385" height="29" rx="10" fill="#FFF4DB"/>
  <text x="1329" y="639" text-anchor="middle" fill="#93370D" font-size="14" font-weight="800">以下均为试点目标，非当前已实现收益</text>

