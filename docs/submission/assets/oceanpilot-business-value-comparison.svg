    <g transform="translate(1118 315)"><rect width="150" height="54" rx="13" fill="#E8F8F4"/><text x="75" y="22" text-anchor="middle" class="flow">规则评估</text><text x="75" y="42" text-anchor="middle" class="micro">精确版本引用</text></g>
    <path d="M944 342h18M1097 342h18" stroke="#1662C5" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
