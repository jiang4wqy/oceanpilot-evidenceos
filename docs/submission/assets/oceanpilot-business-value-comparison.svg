    <path d="M548 348 C475 421 292 421 202 350" stroke-dasharray="6 6"/>
    <path d="M322 287 C266 238 173 249 145 290" stroke-dasharray="6 6"/>
  </g>
  <g>
    <rect x="72" y="413" width="172" height="46" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/><text x="158" y="441" text-anchor="middle" fill="#475467" font-size="15" font-weight="700">多处找截图</text>
    <rect x="252" y="413" width="172" height="46" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/><text x="338" y="441" text-anchor="middle" fill="#475467" font-size="15" font-weight="700">重复确认订单</text>
    <rect x="432" y="413" width="198" height="46" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/><text x="531" y="441" text-anchor="middle" fill="#475467" font-size="15" font-weight="700">人工判断缺失材料</text>
    <rect x="72" y="470" width="172" height="46" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/><text x="158" y="498" text-anchor="middle" fill="#475467" font-size="15" font-weight="700">经验匹配规则</text>
    <rect x="252" y="470" width="172" height="46" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/><text x="338" y="498" text-anchor="middle" fill="#475467" font-size="15" font-weight="700">多次改派</text>
    <rect x="432" y="470" width="198" height="46" rx="12" fill="#FFFFFF" stroke="#D0D5DD"/><text x="531" y="498" text-anchor="middle" fill="#475467" font-size="15" font-weight="700">手工整理申诉材料</text>
  </g>
  <rect x="72" y="532" width="558" height="34" rx="10" fill="#FDECEC"/>
  <text x="351" y="554" text-anchor="middle" fill="#B42318" font-size="15" font-weight="800">摩擦来源：信息散落、等待、反复追问、责任口径不一致</text>

  <!-- convergence arrow -->
  <path d="M680 376h65" stroke="#1662C5" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="712" y="356" text-anchor="middle" fill="#0B5FC6" font-size="14" font-weight="800">收敛</text>

  <!-- upper right -->
  <rect x="762" y="166" width="790" height="420" rx="24" fill="url(#rightPanel)" stroke="#9BC4E9" stroke-width="2"/>
  <rect x="762" y="166" width="790" height="68" rx="24" fill="#E5F2FF"/>
  <rect x="762" y="214" width="790" height="20" fill="#E5F2FF"/>
