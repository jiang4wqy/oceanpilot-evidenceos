  <!-- Feishu collaboration module -->
  <g filter="url(#shadow)">
    <rect x="1318" y="260" width="206" height="238" rx="20" fill="#FFFFFF" stroke="#31A897" stroke-width="2"/>
    <rect x="1318" y="260" width="206" height="52" rx="20" fill="url(#engine)"/>
    <rect x="1318" y="292" width="206" height="20" fill="url(#engine)"/>
