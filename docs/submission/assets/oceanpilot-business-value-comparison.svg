      <circle cx="30" cy="29" r="15" fill="#E8F2FF"/><path d="M20 28h16l-5-5M40 34H24l5 5" fill="none" stroke="#0B5FC6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="35" fill="#344054" font-size="16" font-weight="800">案件改派次数</text>
      <text x="20" y="77" fill="#0B5FC6" font-size="25" font-weight="800">目标降低 30%</text>
