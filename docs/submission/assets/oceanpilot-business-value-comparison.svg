      <circle cx="30" cy="29" r="15" fill="#E8F2FF"/><path d="M22 38l6-8 5 4 7-11" fill="none" stroke="#0B5FC6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
