      <rect x="1336" y="369" width="170" height="32" rx="9" fill="#FFF4DB"/><circle cx="1352" cy="385" r="5" fill="#E99A00"/><text x="1365" y="390">临期案件</text>
      <rect x="1336" y="409" width="170" height="32" rx="9" fill="#FFF4DB"/><circle cx="1352" cy="425" r="5" fill="#E99A00"/><text x="1365" y="430">待人工审批</text>
      <rect x="1336" y="449" width="170" height="32" rx="9" fill="#E8F8F4"/><circle cx="1352" cy="465" r="5" fill="#087F76"/><text x="1365" y="470">已完成复盘</text>
    </g>
