[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanpilot-evidenceos"
version = "0.2.1"
description = "Synthetic local prototype for evidence-driven payment incident collaboration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic==0.120.2",
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded self-contained HTML/JS demo document — line length is not meaningful.
"src/oceanpilot/api/demo.py" = ["E501"]
"src/oceanpilot/admin.py" = ["E501"]
