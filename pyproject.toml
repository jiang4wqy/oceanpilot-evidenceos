[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanpilot-evidenceos"
version = "2.1.0.dev0"
description = "Synthetic competition prototype for evidence-driven cross-border chargeback collaboration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic==0.120.2",
  "cryptography==50.0.1",
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "python-dotenv==1.2.2",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "ruff==0.15.22",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"oceanpilot.data.chargeback_case_library" = ["*.json"]
"oceanpilot.web" = [
  "assets/*.data-uri",
  "shared/*.js",
  "merchant/*.html",
  "merchant/*.css",
  "merchant/*.js",
  "operations/*.html",
  "operations/*.css",
  "operations/*.js",
  "v2/*.html",
  "v2/*.css",
  "v2/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
