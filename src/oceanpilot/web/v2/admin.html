<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT 管理 · OceanPilot</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#233f49;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header,main{max-width:1100px;margin:auto;padding:24px}header,nav{display:flex;align-items:center;gap:20px;flex-wrap:wrap}header{border-bottom:1px solid #d6e1e4}header strong{font-size:22px;margin-right:auto}a{color:#087e70}section{padding:24px;margin:24px 0;border:1px solid #d6e1e4;background:white;border-radius:12px}h1{margin-bottom:8px}h2{font-size:19px}p,small{color:#5d7780}form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:5px}input,select,button{font:inherit;padding:9px 12px;border:1px solid #b8ced0;border-radius:6px;min-width:0}button{cursor:pointer;background:#087e70;color:white}button:disabled{opacity:.5;cursor:wait}.wide{grid-column:1/-1}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:660px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e5eded}small{display:block}.notice{padding:14px;border-radius:8px;background:#e1f2ec}.error{background:#fff0e9;color:#8d3321}[hidden]{display:none!important}@media(max-width:650px){header,main{padding:16px}section{padding:16px}form{grid-template-columns:1fr}}
</style></head><body>
<header><strong>OceanPilot · IT 管理</strong><span id="account">正在验证账号…</span><button id="logout">退出</button></header>
<main><nav><a href="/v2/governance">系统治理</a></nav>
<h1>账号与演示数据</h1><p>IT 管理员管理账号、系统与合成交易，不读取运行案件、不办理或审批拒付业务。</p><div id="notice" class="notice" role="status" hidden></div>
<section><h2>创建账号</h2><form id="accountForm">
<label>用户名<input name="username" minlength="3" maxlength="80" autocomplete="off" required></label><label>姓名<input name="display_name" maxlength="80" required></label>
<label>初始密码<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label>
<label>角色<select name="role"><option value="OPERATOR">风控专员</option><option value="SUPERVISOR">风控经理</option><option value="ADMIN">IT 管理员</option><option value="MERCHANT">商户</option></select></label>
<label class="wide">授权商户 ID（逗号分隔；商户填写一个；经理和 IT 管理员可留空）<input name="merchants" maxlength="5000"></label><div class="wide"><button type="submit">创建账号</button></div></form></section>
<section><h2>用户账号</h2><div id="accounts" class="scroll">正在读取…</div></section>
<section><h2>登记合成交易</h2><form id="transactionForm">
<label>交易 ID<input name="transaction_id" maxlength="100" required></label><label>商户 ID<input name="merchant_id" maxlength="100" required></label>
<label>渠道<input name="channel" maxlength="30" required></label><label>卡组织<select name="scheme"><option>VISA</option><option>MASTERCARD</option></select></label>
<label>金额（最小货币单位）<input name="amount_minor" type="number" min="1" max="1000000000000" step="1" required></label><label>币种<input name="currency" pattern="[A-Z]{3}" maxlength="3" placeholder="USD" required></label>
<label class="wide">合成数据来源说明<input name="reference" maxlength="500" required></label><div class="wide"><button type="submit">登记合成交易</button></div></form></section>
<section><h2>已登记交易</h2><div id="transactions" class="scroll">正在读取…</div></section></main>
<script>
(()=>{"use strict";
const $=id=>document.getElementById(id), esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
const names={MERCHANT:'商户',OPERATOR:'风控专员',SUPERVISOR:'风控经理',ADMIN:'IT 管理员'};let session,busy=false;
function notice(message,error=false){$('notice').textContent=message;$('notice').hidden=!message;$('notice').classList.toggle('error',error)}
async function api(path,options={}){const response=await fetch('/api/v2'+path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(session?.csrf_token?{'X-CSRF-Token':session.csrf_token}:{})}});const body=await response.json();if(!response.ok){if(response.status===401)location.replace('/v2/login?next=%2Fv2%2Fadmin');throw new Error(typeof body.detail==='string'?body.detail:body.detail?.message||body.message||'操作失败，请重试。')}return body}
async function reload(){const [accounts,transactions]=await Promise.all([api('/admin/accounts'),api('/admin/transactions')]);$('accounts').innerHTML='<table><thead><tr><th>姓名 / 用户名</th><th>角色</th><th>案件范围</th><th>状态</th><th>操作</th></tr></thead><tbody>'+accounts.users.map(u=>`<tr><td>${esc(u.display_name)}<small>${esc(u.username)}</small></td><td>${esc(names[u.role]||u.role)}</td><td>${u.role==='ADMIN'?'无运行案件访问权限':u.role==='SUPERVISOR'?'全部案件':esc(u.merchant_ids.join('、'))}</td><td>${u.disabled?'已停用':'可登录'}</td><td>${u.id===session.user.id?'当前账号':`<button data-user="${esc(u.id)}" data-disabled="${!u.disabled}">${u.disabled?'启用':'停用'}</button>`}</td></tr>`).join('')+'</tbody></table>';
$('transactions').innerHTML=transactions.transactions.length?'<table><thead><tr><th>交易 / 商户</th><th>渠道</th><th>金额</th><th>来源</th></tr></thead><tbody>'+transactions.transactions.map(t=>`<tr><td>${esc(t.transaction_id)}<small>${esc(t.merchant_id)}</small></td><td>${esc(t.channel)} / ${esc(t.scheme)}</td><td>${esc(t.currency)} ${esc(t.amount_minor)}</td><td>${esc(t.reference)}</td></tr>`).join('')+'</tbody></table>':'暂无合成交易。'}
async function mutate(button,work){if(busy)return;busy=true;button.disabled=true;try{await work();await reload()}catch(error){notice(error.message,true)}finally{busy=false;button.disabled=false}}
$('accountForm').addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));const merchants=[...new Set(data.merchants.split(/[,，]/).map(s=>s.trim()).filter(Boolean))];delete data.merchants;if(data.role==='MERCHANT'&&merchants.length!==1||data.role==='OPERATOR'&&!merchants.length){notice('商户必须填写一个商户 ID；风控专员至少填写一个获授权商户。',true);return}data.merchant_ids=merchants;data.merchant_id=data.role==='MERCHANT'?merchants[0]:null;mutate(form.querySelector('button'),async()=>{await api('/admin/accounts',{method:'POST',body:JSON.stringify(data)});form.reset();notice('账号已创建。')})});
$('transactionForm').addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));data.amount_minor=Number(data.amount_minor);mutate(form.querySelector('button'),async()=>{await api('/admin/transactions',{method:'POST',body:JSON.stringify(data)});form.reset();notice('合成交易已登记，可在风控工作台接收对应上游事件。')})});
$('accounts').addEventListener('click',event=>{const button=event.target.closest('[data-user]');if(button)mutate(button,async()=>{await api('/admin/accounts/'+encodeURIComponent(button.dataset.user)+'/status',{method:'POST',body:JSON.stringify({disabled:button.dataset.disabled==='true'})});notice('账号状态已更新。')})});
$('logout').addEventListener('click',async()=>{try{await api('/session/logout',{method:'POST'});location.replace('/v2/login')}catch(error){notice(error.message,true)}});
(async()=>{try{session=await api('/session');if(session.user.role!=='ADMIN')throw new Error('需要 IT 管理员账号。');$('account').textContent=session.user.display_name;await reload()}catch(error){notice(error.message,true);document.querySelectorAll('form button').forEach(b=>b.disabled=true)}})();
})();
</script></body></html>
