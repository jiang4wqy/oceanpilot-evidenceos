<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>演示准备 · OceanPilot</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#264852;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header,main{max-width:1080px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #dce7e9}header strong{font-size:22px}header div{display:flex;align-items:center;gap:16px;font-size:13px}h1{font-size:26px;margin:0 0 10px}h2{font-size:18px;margin-top:0}p{font-size:14px;line-height:1.7;color:#64808a}section{padding:24px;margin:20px 0;background:white;border:1px solid #dbe6e9;border-radius:12px}form{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;font-size:13px}input,select{font:inherit;font-size:14px;min-width:0;width:100%;padding:10px;border:1px solid #cbdadd;border-radius:7px}button{border:1px solid #ccdcdf;background:white;border-radius:7px;padding:10px 15px;color:#315a69;font-size:13px;cursor:pointer}button.primary{background:#148678;color:white;border-color:#148678}button:disabled{opacity:.6;cursor:wait}.wide{grid-column:1/-1}.confirmation{display:flex;gap:8px;align-items:flex-start;line-height:1.7}.confirmation input{width:auto;margin-top:4px}.notice{padding:14px;margin:16px 0;background:#eaf7f1;border:1px solid #c8e1d6;border-radius:8px;font-size:13px;line-height:1.7}.notice.error{background:#fff4f0;color:#974537;border-color:#ecd0c5}.scroll{overflow:auto}table{border-collapse:collapse;min-width:610px;width:100%;font-size:13px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid #e5edef;line-height:1.6}th{font-weight:650;color:#6d858e}small{display:block;color:#71838a;overflow-wrap:anywhere}.empty{padding:20px;color:#768b92;font-size:14px}.notice[hidden]{display:none}@media(max-width:600px){header,main{padding:18px}header{align-items:flex-start}header strong{font-size:19px}header div{flex-wrap:wrap;justify-content:flex-end}section{padding:18px}form{grid-template-columns:1fr}}
</style></head><body><header><strong>OceanPilot · 演示准备</strong><div><span id="account">正在确认导演账号…</span><button id="logout" type="button">退出</button></div></header><main><h1>准备合成演练数据</h1><p>导演登记合成交易和查看分配的账号。运营、商户、风控与主管分别使用自己的账号，在正常工作空间共同处理案件。</p><div id="notice" class="notice" role="status" hidden></div><section><h2>登记合成交易</h2><p>登记后，运营可以根据实际测试信封接收上游事件。注册交易本身不会创建争议或代任何人作出决定。</p><form id="transactionForm"><label>合成交易 ID<input name="transaction_id" maxlength="100" required></label><label>商户 ID<input name="merchant_id" maxlength="100" required></label><label>渠道<input name="channel" maxlength="30" required></label><label>卡组织<select name="scheme" required><option value="">请选择</option><option>VISA</option><option>MASTERCARD</option></select></label><label>金额（最小货币单位）<input name="amount_minor" type="number" min="1" max="1000000000000" step="1" required></label><label>币种<input name="currency" pattern="[A-Z]{3}" maxlength="3" placeholder="USD" required></label><label class="wide">合成数据来源说明<input name="reference" maxlength="500" required></label><label class="confirmation wide"><input type="checkbox" id="syntheticConfirm" required>我确认这是一笔明确的合成测试交易，已核对商户、币种、金额与来源说明。</label><div class="wide"><button class="primary" id="register" type="submit">登记合成交易</button></div></form></section><section><h2>已登记的合成交易</h2><div id="transactions" class="scroll"><p>正在读取…</p></div></section><section><h2>已分配的独立账号</h2><p>此处仅展示账号与职责，不切换或代用这些身份。</p><div id="accounts" class="scroll"><p>正在读取…</p></div></section></main><script>
(()=>{"use strict";const $=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);let session,busy=false;function notify(message,error=false){$('notice').textContent=message;$('notice').hidden=!message;$('notice').classList.toggle('error',error)}async function api(path,options={}){const r=await fetch('/api/v2'+path,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(session?.csrf_token?{'X-CSRF-Token':session.csrf_token}:{})}});const b=await r.json();if(!r.ok){if(r.status===401)location.replace('/v2/login?next=%2Fv2%2Fdirector');throw new Error(typeof b.detail==='string'?b.detail:b.detail?.message||b.message||'请求未完成，请核对信息。')}return b}async function reload(){const[accounts,transactions]=await Promise.all([api('/director/accounts'),api('/director/transactions')]);$('accounts').innerHTML='<table><thead><tr><th>账号 / 姓名</th><th>职责</th><th>获授权商户</th><th>状态</th></tr></thead><tbody>'+accounts.users.map(user=>`<tr><td>${esc(user.display_name)}<small>${esc(user.username)}</small></td><td>${esc(({DIRECTOR:'演示导演',MERCHANT:'商户协作人',OPERATOR:'运营专员',RISK_OFFICER:'风控审核员',SUPERVISOR:'主管',ADMIN:'知识管理员'})[user.role]||user.role)}</td><td>${esc((user.merchant_ids||[]).join('、')||'—')}</td><td>${user.disabled?'已停用':'可登录'}</td></tr>`).join('')+'</tbody></table>';$('transactions').innerHTML=transactions.transactions.length?'<table><thead><tr><th>交易 / 商户</th><th>渠道 / 卡组织</th><th>金额（最小单位）</th><th>来源说明</th></tr></thead><tbody>'+transactions.transactions.map(transaction=>`<tr><td>${esc(transaction.transaction_id)}<small>${esc(transaction.merchant_id)}</small></td><td>${esc(transaction.channel)}<small>${esc(transaction.scheme)}</small></td><td>${esc(transaction.currency)} ${esc(transaction.amount_minor)}</td><td>${esc(transaction.reference)}</td></tr>`).join('')+'</tbody></table>':'<div class="empty">尚未登记合成交易。</div>'}$('logout').addEventListener('click',async()=>{if(busy)return;try{await api('/session/logout',{method:'POST'});location.replace('/v2/login?next=%2Fv2%2Fdirector')}catch(error){notify(error.message,true)}});$('transactionForm').addEventListener('submit',async event=>{event.preventDefault();if(busy||!event.target.reportValidity())return;const data=Object.fromEntries(new FormData(event.target));data.amount_minor=Number(data.amount_minor);busy=true;$('register').disabled=true;try{await api('/director/transactions',{method:'POST',body:JSON.stringify(data)});notify('合成交易已登记。请由运营账号接收对应上游事件。');event.target.reset();await reload()}catch(error){notify(error.message,true)}finally{busy=false;$('register').disabled=false}});(async()=>{try{session=await api('/session');if(session.user?.role!=='DIRECTOR'){document.querySelector('main').innerHTML='<h1>此账号不能访问演示准备空间</h1><p>请使用获授权的独立导演账号。</p>';return}$('account').textContent=session.user.display_name;await reload()}catch(error){notify(error.message,true);$('register').disabled=true}})();})();
</script></body></html>
