<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · OceanPilot</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f2f6f7;color:#173e48;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;display:grid;place-items:center;padding:24px}.login{width:min(100%,420px);background:#fff;padding:38px;border:1px solid #dce7e9;border-radius:16px;box-shadow:0 14px 45px #14364109}.brand{font-size:22px;font-weight:750;color:#15887c;letter-spacing:-.5px}.brand span{color:#264b58}h1{font-size:26px;margin:30px 0 10px}p{font-size:14px;line-height:1.7;color:#6c8189}form{display:grid;gap:18px;margin-top:26px}label{font-size:13px;font-weight:650;display:grid;gap:8px}input{border:1px solid #c7d7dc;border-radius:7px;font:inherit;font-size:16px;padding:12px;width:100%}input:focus{outline:2px solid #b8e0da;border-color:#188c80}button{padding:13px;border:0;border-radius:7px;background:#16877c;color:white;font-size:15px;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.error{color:#a8443c;background:#fff3ef;padding:12px;border-radius:7px;font-size:13px;line-height:1.6}.foot{margin-top:24px;padding-top:20px;border-top:1px solid #e7edef;font-size:12px}.error[hidden]{display:none}
</style></head><body><main class="login"><div class="brand">✧ Ocean<span>Pilot</span></div><h1>登录你的工作空间</h1><p>使用分配给你的账号，继续处理获授权的案件与同案沟通。</p><form id="loginForm"><label>账号<input id="username" name="username" autocomplete="username" maxlength="120" required autofocus></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" maxlength="200" required></label><div id="loginError" class="error" role="alert" hidden></div><button id="loginSubmit" type="submit">登录</button></form><p class="foot">商户决定与材料 · OceanPayment 处理 · OceanPilot 同案协作<br>当前业务数据为合成演练，上游提交为 Mock。</p></main><script>
(()=>{"use strict";const form=document.getElementById('loginForm'),notice=document.getElementById('loginError'),button=document.getElementById('loginSubmit');form.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;notice.hidden=true;button.disabled=true;button.textContent='正在登录…';try{const response=await fetch('/api/v2/session/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(typeof data.detail==='string'?data.detail:data.message||'账号或密码不正确，请重新核对。');const own='/v2/'+(data.surface|| (data.user?.role==='MERCHANT'?'merchant':'operations'));const wanted=new URL(location.href).searchParams.get('next');let next=own;if(wanted&&/^\/v2\/(merchant|operations|governance)(\/|\?|$)/.test(wanted)&&!wanted.startsWith('//')){const target=new URL(wanted,location.origin);if(target.origin===location.origin&&(target.pathname.startsWith(own)||data.user?.role!=='MERCHANT'&&!target.pathname.startsWith('/v2/merchant')))next=target.pathname+target.search+target.hash;}location.replace(next);}catch(error){notice.textContent=error.message;notice.hidden=false;}finally{button.disabled=false;button.textContent='登录';}});})();
</script></body></html>
